<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>띵스팀 자료실</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="brand-bar">
    <div class="brand-inner">
      <h1 class="brand">
        <img src="img/logo-safeu.svg" alt="세이프유" width="100" height="18">
        <img class="logo-things" src="img/logo-things.svg" alt="THINGS" width="85" height="22">
        <span class="brand-name">자료실</span>
      </h1>
    </div>
  </header>

  <main class="portal">
    <form id="unlock" class="unlock" hidden>
      <label for="pw">자료실 비밀번호</label>
      <p class="hint" id="pw-hint">비밀번호는 팀 관리자에게 받으세요.</p>
      <div class="unlock-row">
        <input id="pw" type="password" autocomplete="current-password" aria-describedby="pw-hint unlock-msg" required>
        <button type="submit" id="unlock-btn" class="primary">열기</button>
      </div>
      <p id="unlock-msg" class="unlock-msg" aria-live="polite"></p>
    </form>

    <div id="app" hidden>
      <div class="filters">
        <input id="q" type="search" placeholder="자료명·현장·태그 검색" aria-label="자료 검색 (자료명·현장·태그·파일 이름)" autocomplete="off">
        <select id="site" aria-label="현장">
          <option value="">모든 현장</option>
        </select>
        <select id="category" aria-label="자료 종류">
          <option value="">모든 종류</option>
          <option value="app">앱</option>
          <option value="manual">매뉴얼</option>
          <option value="guide">퀵 가이드</option>
          <option value="other">기타</option>
        </select>
      </div>
      <nav id="facets" class="facets" aria-label="자료 거르기"></nav>
    </div>

    <div class="list-bar">
      <div id="status" class="status" role="status"></div>
      <select id="sort" aria-label="정렬" hidden>
        <option value="new">최신순</option>
        <option value="name">이름순</option>
      </select>
    </div>
    <div class="list-head" aria-hidden="true"><span>자료</span><span>형식</span><span>버전</span><span>현장</span><span>갱신일</span><span></span></div>
    <ul id="list" class="cards"></ul>
  </main>

  <dialog id="qr-dialog" class="qr-dialog" aria-labelledby="qr-title">
    <h2 id="qr-title"></h2>
    <img id="qr-img" alt="" width="264" height="264">
    <p id="qr-url" class="qr-url"></p>
    <div class="qr-actions">
      <a id="qr-save" class="button secondary">QR 이미지 저장</a>
      <button id="qr-close" type="button" class="primary">닫기</button>
    </div>
  </dialog>

  <script src="js/qrcode.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
